name: Verify web foundation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate PPT presentation source
        run: node --experimental-strip-types scripts/validate-ppt.mjs
      - name: Unit tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
      - name: Smoke test routes
        shell: bash
        run: |
          pnpm start > /tmp/xcn-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          for route in "/" "/khoa-hoc/excel-can-ban" "/student" "/student/quiz" "/student/khoa-hoc/excel-can-ban/giao-dien-va-vung-lam-viec" "/cong-cu" "/cong-cu/trinh-chieu" "/cong-cu/trinh-chieu/quan-ly-tep-va-thu-muc" "/cong-cu/trinh-chieu/layout-gallery" "/admin" "/admin/roadmap" "/admin/sitemap" "/admin/nguoi-dung" "/admin/phan-quyen" "/admin/cau-hinh" "/admin/nhat-ky" "/admin/he-thong" "/admin/bao-cao"; do
            echo "Checking $route"
            curl --fail --silent --show-error "http://127.0.0.1:3000$route" > /dev/null
          done
          # Every Admin control-center screen must respond in Demo without user JWTs.
          roles_html="$(curl --fail --silent --show-error 'http://127.0.0.1:3000/admin/phan-quyen')"
          monitor_html="$(curl --fail --silent --show-error 'http://127.0.0.1:3000/admin/he-thong')"
          report_html="$(curl --fail --silent --show-error 'http://127.0.0.1:3000/admin/bao-cao')"
          if ! grep -q 'Phân quyền hệ thống' <<< "$roles_html"; then
            echo "Admin permissions screen missing"
            exit 1
          fi
          if ! grep -q 'Giám sát hệ thống' <<< "$monitor_html"; then
            echo "Admin system monitor missing"
            exit 1
          fi
          if ! grep -q 'Báo cáo nền tảng' <<< "$report_html"; then
            echo "Admin report missing"
            exit 1
          fi
          # Admin screens must render in Demo; API must stay closed without Live Auth.
          admin_html="$(curl --fail --silent --show-error 'http://127.0.0.1:3000/admin')"
          roadmap_html="$(curl --fail --silent --show-error 'http://127.0.0.1:3000/admin/roadmap')"
          sitemap_html="$(curl --fail --silent --show-error 'http://127.0.0.1:3000/admin/sitemap')"
          grep -q 'Quản trị toàn nền tảng' <<< "$admin_html"
          grep -q 'Roadmap phát triển' <<< "$roadmap_html"
          grep -q 'Sơ đồ toàn website' <<< "$sitemap_html"
          api_status="$(curl --silent --output /tmp/xcn-admin-api.json --write-out '%{http_code}' 'http://127.0.0.1:3000/api/admin/roadmap')"
          if [ "$api_status" != "403" ]; then
            echo "Admin Roadmap API must reject Demo requests (got $api_status)"
            exit 1
          fi
          # Preserve old teaching-session URLs with a permanent redirect.
          legacy_headers="$(curl --silent --show-error --head 'http://127.0.0.1:3000/cong-cu/trinh-chieu/buoi-01-file-explorer?class=hl-26-27')"
          if ! grep -qi '308 Permanent Redirect' <<< "$legacy_headers"; then
            echo "Legacy presentation URL must permanently redirect"
            exit 1
          fi
          if ! grep -qi 'quan-ly-tep-va-thu-muc?class=hl-26-27' <<< "$legacy_headers"; then
            echo "Legacy presentation URL must preserve the class"
            exit 1
          fi
          # Presentation pages intentionally bypass the public site's header and footer.
          presentation_html="$(curl --fail --silent --show-error 'http://127.0.0.1:3000/cong-cu/trinh-chieu/quan-ly-tep-va-thu-muc')"
          if grep -q 'aria-label="Điều hướng chính"' <<< "$presentation_html"; then
            echo "Site header leaked into presentation route"
            exit 1
          fi
          if grep -q '<footer' <<< "$presentation_html"; then
            echo "Site footer leaked into presentation route"
            exit 1
          fi
          if ! grep -q 'aria-label="Điều khiển trình chiếu"' <<< "$presentation_html"; then
            echo "Presentation controls are missing"
            exit 1
          fi
          # Full-bleed presentation with exactly two bottom-corner pills and an overlaid right rail.
          for marker in 'aria-label="Điều hướng nhanh giữa các slide"' 'xcn-presentation-toolbar' 'xcn-presentation-pill' 'xcn-presentation-context'; do
            if ! grep -q "$marker" <<< "$presentation_html"; then
              echo "Presentation control missing: $marker"
              exit 1
            fi
          done
          # Keep the slide itself full-bleed (no centered stage or top toolbar).
          if grep -q 'xcn-presentation-stage grid' <<< "$presentation_html"; then
            echo "Slide stage must not use the legacy grid and inset"
            exit 1
          fi
          if ! grep -q 'class="xcn-presentation-frame"' <<< "$presentation_html"; then
            echo "Full-viewport slide frame is missing"
            exit 1
          fi
          if ! grep -q 'aria-label="Làm lại tương tác"' <<< "$presentation_html"; then
            echo "Right-side function buttons are missing"
            exit 1
          fi
          if ! grep -q 'aria-label="Trình chiếu toàn màn hình"' <<< "$presentation_html"; then
            echo "Right-side fullscreen control is missing"
            exit 1
          fi
          # Class entry and two-pill layout must exist, without old fixed class cards.
          if ! grep -q 'Nhập tên lớp' <<< "$presentation_html"; then
            echo "Class-entry dialog is missing"
            exit 1
          fi
          library_html="$(curl --fail --silent --show-error 'http://127.0.0.1:3000/cong-cu/trinh-chieu')"
          if grep -q 'Đã có nội dung' <<< "$library_html"; then
            echo "Redundant content badge must be removed"
            exit 1
          fi
          dot_count="$(grep -o 'xcn-presentation-rail-button' <<< "$presentation_html" | wc -l)"
          if [ "$dot_count" -ne 29 ]; then
            echo "Expected 29 slide pagination dots, found $dot_count"
            exit 1
          fi
          if grep -q 'id="slide-selector"' <<< "$presentation_html"; then
            echo "Legacy range slider should not be rendered"
            exit 1
          fi
          # Real headless Chrome checks (27 screenshots across desktop/tablet/mobile).
          command -v google-chrome || command -v chromium
          ADMIN_QA_OUTPUT=/tmp/xcn-admin-qa node scripts/admin-browser-qa.mjs
          # D1 public foundation: 5 marketing routes x 360/768/1280/1920, mobile menu + Escape.
          PUBLIC_QA_OUTPUT=/tmp/xcn-public-qa node scripts/public-browser-qa.mjs
          # Word Lab: real Chrome typing, formatting, Ctrl+Enter, Cut denied, rich Sort and Undo/Redo.
          WORD_QA_OUTPUT=/tmp/xcn-word-qa node scripts/word-browser-qa.mjs

      - name: Upload Admin visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-browser-qa-screenshots
          path: /tmp/xcn-admin-qa/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Public D1 visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-d1-browser-qa-screenshots
          path: /tmp/xcn-public-qa/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Word Lab local Chromium QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: word-browser-qa-evidence
          path: /tmp/xcn-word-qa/
          if-no-files-found: ignore
          retention-days: 7
